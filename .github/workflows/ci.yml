name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A second push to the same branch cancels the first run still in flight.
# Without this, two devs pushing rapidly queue up macOS runners for results
# nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — unit tests + debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Verifies gradle-wrapper.jar against the known-good checksum list.
          # Public repo: a PR that swaps the wrapper jar otherwise runs
          # arbitrary code on the runner.
          validate-wrappers: true

      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: shared/build/reports/tests/

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS — simulator unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # The Kotlin/Native toolchain (~2 GB: compiler, llvm, platform klibs)
      # lives outside ~/.gradle, so setup-gradle's cache does not cover it.
      # Cold download is several minutes per run.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build iOS app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/